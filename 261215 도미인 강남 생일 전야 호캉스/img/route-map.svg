<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect width="600" height="400" rx="18" fill="#12291d" stroke="#e9c46a" stroke-opacity="0.35"/>
  <!-- 골목 -->
  <g stroke="#1e3d2d" stroke-width="6" stroke-linecap="round">
    <line x1="150" y1="400" x2="150" y2="220"/>
    <line x1="300" y1="400" x2="300" y2="161"/>
    <line x1="430" y1="400" x2="430" y2="110"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="350" y1="0" x2="350" y2="141"/>
    <line x1="52" y1="330" x2="300" y2="330"/>
  </g>
  <!-- 강남대로 -->
  <line x1="40" y1="0" x2="40" y2="400" stroke="#2f5a44" stroke-width="22"/>
  <line x1="40" y1="0" x2="40" y2="400" stroke="#7fa08c" stroke-width="1.5" stroke-dasharray="10 9"/>
  <text x="46" y="24" fill="#cfe0d2" font-size="13" font-weight="700" transform="rotate(90 46 24)">강남대로</text>
  <!-- 봉은사로 -->
  <line x1="40" y1="264" x2="600" y2="42" stroke="#2f5a44" stroke-width="22" stroke-linecap="round"/>
  <line x1="40" y1="264" x2="600" y2="42" stroke="#7fa08c" stroke-width="1.5" stroke-dasharray="10 9"/>
  <text x="470" y="78" fill="#cfe0d2" font-size="14" font-weight="700" transform="rotate(-21.6 470 78)">봉은사로</text>
  <!-- 걷는 길: 정류장 → 교차로 → 호텔 -->
  <polyline points="40,196 40,264 268,176" fill="none" stroke="#ffffff" stroke-width="5" stroke-dasharray="2 9" stroke-linecap="round"/>
  <text x="96" y="268" fill="#ffffff" font-size="14" font-weight="700" transform="rotate(-21.6 96 268)">걸어서 8분 · 450m</text>
  <!-- 걷는 길: 호텔 → 횡단보도 → 호텔카푸치노 -->
  <polyline points="300,196 318,154 372,132 378,114" fill="none" stroke="#f2cf6b" stroke-width="5" stroke-dasharray="2 9" stroke-linecap="round"/>
  <text x="396" y="150" fill="#f2cf6b" font-size="14" font-weight="700">걸어서 4분 · 230m</text>
  <!-- 버스 정류장 -->
  <rect x="24" y="166" width="32" height="30" rx="6" fill="#1f7a4d" stroke="#fbf5e6"/>
  <text x="40" y="187" fill="#fff" font-size="15" text-anchor="middle">🚌</text>
  <text x="64" y="178" fill="#7fd9a8" font-size="14" font-weight="800">교보타워 정류장</text>
  <text x="64" y="196" fill="#cfe0d2" font-size="12.5">4312번 내리는 곳</text>
  <!-- 신논현역 -->
  <circle cx="40" cy="300" r="14" fill="#bb8336"/><text x="40" y="305" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">9</text>
  <text x="62" y="305" fill="#fbf5e6" font-size="13" font-weight="700">신논현역</text>
  <!-- 회사 방향 -->
  <text x="56" y="390" fill="#cfe0d2" font-size="12.5" font-weight="700">↓ 강남역 정류장 550m · 아이티윌 약 2km</text>
  <!-- 언주역 -->
  <circle cx="505" cy="80" r="14" fill="#bb8336"/><text x="505" y="85" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">9</text>
  <text x="505" y="116" fill="#fbf5e6" font-size="13" font-weight="700" text-anchor="middle">언주역</text>
  <!-- 도미인 -->
  <rect x="270" y="186" width="46" height="38" rx="7" fill="#e5484d" stroke="#fbf5e6"/>
  <text x="293" y="211" fill="#fff" font-size="16" font-weight="800" text-anchor="middle">🏨</text>
  <text x="326" y="212" fill="#fff" font-size="16" font-weight="800">도미인 서울 강남</text>
  <text x="326" y="230" fill="#ffb3b3" font-size="12.5" font-weight="600">봉은사로 134</text>
  <!-- A 핫이슈 -->
  <rect x="358" y="78" width="42" height="36" rx="7" fill="#f2cf6b"/>
  <text x="379" y="102" fill="#12291d" font-size="16" font-weight="800" text-anchor="middle">A</text>
  <text x="379" y="62" fill="#f2cf6b" font-size="15" font-weight="800" text-anchor="middle">핫이슈 · 호텔카푸치노 17층</text>
  <text x="379" y="44" fill="#fbf5e6" font-size="12.5" text-anchor="middle">야경 이탈리안 · 봉은사로 155</text>
  <!-- B 브리비트 -->
  <rect x="172" y="284" width="36" height="32" rx="7" fill="#f2cf6b"/>
  <text x="190" y="306" fill="#12291d" font-size="16" font-weight="800" text-anchor="middle">B</text>
  <text x="216" y="298" fill="#f2cf6b" font-size="14" font-weight="800">브리비트</text>
  <text x="216" y="315" fill="#cfe0d2" font-size="12">직선 320m</text>
  <!-- C 녘 -->
  <rect x="100" y="338" width="36" height="32" rx="7" fill="#f2cf6b"/>
  <text x="118" y="360" fill="#12291d" font-size="16" font-weight="800" text-anchor="middle">C</text>
  <text x="144" y="352" fill="#f2cf6b" font-size="14" font-weight="800">녘</text>
  <text x="144" y="369" fill="#cfe0d2" font-size="12">직선 400m</text>
  <!-- 방위 -->
  <text x="566" y="384" fill="#7fa08c" font-size="12" text-anchor="middle">N ↑</text>
</svg>
