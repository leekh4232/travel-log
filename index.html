<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Log</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px 20px 60px; background: #f4f2ee; color: #222; font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; }
  header { max-width: 1200px; margin: 0 auto 28px; }
  header h1 { margin: 0; font-size: 32px; letter-spacing: -0.02em; }
  /* 벽돌 배치: 카드를 열마다 번갈아 넣어(아래 스크립트) 왼쪽→오른쪽 최신순으로 읽히게 한다. 카드 높이는 표지 그림 비율을 따른다 */
  section { max-width: 1200px; margin: 0 auto 36px; }
  section h2.group { margin: 0 0 14px; font-size: 20px; letter-spacing: -0.01em; }
  section h2.group small { margin-left: 8px; font-size: 14px; font-weight: 500; color: #888; }
  .grid { display: flex; gap: 16px; align-items: flex-start; }
  .col { flex: 1; min-width: 0; }
  .card { position: relative; display: block; margin-bottom: 16px; border-radius: 14px; overflow: hidden; color: #fff; text-decoration: none; background: linear-gradient(135deg, #7c5cff, #ff3d9a); min-height: 180px; box-shadow: 0 2px 8px rgba(0,0,0,.08); transition: transform .2s, box-shadow .2s; }
  .card:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(0,0,0,.18); }
  .card img { display: block; width: 100%; height: auto; }
  .meta { position: absolute; inset: auto 0 0 0; padding: 48px 18px 16px; background: linear-gradient(transparent, rgba(0,0,0,.72)); }
  .meta time { font-size: 13px; opacity: .85; letter-spacing: .04em; }
  .meta h2 { margin: 4px 0 0; font-size: 20px; line-height: 1.3; }
</style>
</head>
<body>
<header><h1>Travel Log</h1></header>
<main>
<section><h2 class="group">채택된 계획<small>확정해서 갈 여행</small></h2><div class="grid">
<a class="card" href="/261128%20%EC%84%9C%EC%82%B0%20%EC%97%AC%EC%9C%A0%20%EC%82%B0%EC%B1%85%201%EB%B0%95%202%EC%9D%BC/" target="_blank"><img src="/261128%20%EC%84%9C%EC%82%B0%20%EC%97%AC%EC%9C%A0%20%EC%82%B0%EC%B1%85%201%EB%B0%95%202%EC%9D%BC/cover.jpg" alt="" loading="lazy"><div class="meta"><time>2026.11.28</time><h2>서산 여유 산책 1박 2일</h2></div></a>
<a class="card" href="/261108%20%EC%9E%84%EC%8B%A4%20%EA%B0%80%EC%9D%84%20%EB%8B%B9%EC%9D%BC%EC%B9%98%EA%B8%B0/" target="_blank"><img src="/261108%20%EC%9E%84%EC%8B%A4%20%EA%B0%80%EC%9D%84%20%EB%8B%B9%EC%9D%BC%EC%B9%98%EA%B8%B0/cover.jpg" alt="" loading="lazy"><div class="meta"><time>2026.11.08</time><h2>임실 가을 당일치기</h2></div></a>
<a class="card" href="/261030%20%EC%95%84%EC%82%B0%20%EA%B0%80%EC%9D%84%20%EB%8B%B9%EC%9D%BC%EC%B9%98%EA%B8%B0/" target="_blank"><img src="/261030%20%EC%95%84%EC%82%B0%20%EA%B0%80%EC%9D%84%20%EB%8B%B9%EC%9D%BC%EC%B9%98%EA%B8%B0/cover.jpg" alt="" loading="lazy"><div class="meta"><time>2026.10.30</time><h2>아산 가을 당일치기</h2></div></a>
</div></section>
<section><h2 class="group">후보 계획<small>아직 고르는 중</small></h2><div class="grid">
<a class="card" href="/261102%20%EB%B6%81%EC%B4%8C%20%ED%95%9C%EC%98%A5%20%EB%85%B8%EC%B2%9C%EC%8A%A4%ED%8C%8C%201%EB%B0%95%202%EC%9D%BC/" target="_blank"><img src="/261102%20%EB%B6%81%EC%B4%8C%20%ED%95%9C%EC%98%A5%20%EB%85%B8%EC%B2%9C%EC%8A%A4%ED%8C%8C%201%EB%B0%95%202%EC%9D%BC/cover.jpg" alt="" loading="lazy"><div class="meta"><time>2026.11.02</time><h2>북촌 한옥 노천스파 1박 2일</h2></div></a>
<a class="card" href="/261102%20%EA%B8%88%EC%82%B0%20%EC%97%AD%EC%82%AC%20%EA%B8%B0%ED%96%89%201%EB%B0%95%202%EC%9D%BC/" target="_blank"><img src="/261102%20%EA%B8%88%EC%82%B0%20%EC%97%AD%EC%82%AC%20%EA%B8%B0%ED%96%89%201%EB%B0%95%202%EC%9D%BC/cover.jpg" alt="" loading="lazy"><div class="meta"><time>2026.11.02</time><h2>금산 역사 기행 1박 2일</h2></div></a>
<a class="card" href="/261101%20%ED%94%84%EB%9D%BC%EC%9D%B4%EB%B9%97%20%EC%9A%95%EC%A1%B0%20%EC%88%99%EC%86%8C%20%EC%B6%94%EC%B2%9C/" target="_blank"><img src="/261101%20%ED%94%84%EB%9D%BC%EC%9D%B4%EB%B9%97%20%EC%9A%95%EC%A1%B0%20%EC%88%99%EC%86%8C%20%EC%B6%94%EC%B2%9C/cover.jpg" alt="" loading="lazy"><div class="meta"><time>2026.11.01</time><h2>프라이빗 욕조 숙소 추천</h2></div></a>
</div></section>
</main>
<script>
  // 묶음(채택·후보)마다 따로 벽돌 배치한다
  document.querySelectorAll('.grid').forEach(function (grid) {
    var cards = Array.prototype.slice.call(grid.children), cur = 0;
    function layout() {
      var n = Math.max(1, Math.min(4, Math.floor((grid.clientWidth + 16) / 276)));
      if (n === cur) return;
      cur = n; grid.innerHTML = '';
      var cols = [];
      for (var i = 0; i < n; i++) { cols.push(grid.appendChild(document.createElement('div'))); cols[i].className = 'col'; }
      cards.forEach(function (c, i) { cols[i % n].appendChild(c); });
    }
    layout(); addEventListener('resize', layout);
  });

  // 카드를 누르면 슬라이드를 팝업 창으로 연다. 팝업이 막히면 링크의 target=_blank 로 새 탭에서 열린다
  document.querySelectorAll('.card').forEach(function (a) {
    a.addEventListener('click', function (e) {
      var w = Math.min(1280, screen.availWidth), h = Math.min(760, screen.availHeight);
      var left = (screen.availWidth - w) / 2, top = (screen.availHeight - h) / 2;
      var win = window.open(a.href, '_blank', 'popup,width=' + w + ',height=' + h + ',left=' + left + ',top=' + top);
      if (win) e.preventDefault();
    });
  });
</script>
</body>
</html>
